name: 功能请求（中文）
description: 提议一个新功能或改进
title: "[Feature] "
labels: ["enhancement", "lang:zh"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 当前遇到的问题
      description: 这个新功能要解决什么问题？没有它你怎么变通？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 你期望它怎么工作？UI 长什么样？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 还想到过别的解决思路吗？为什么不选它们？
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 其他信息
      description: 引用、截图、相关链接等
    validations:
      required: false
